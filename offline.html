<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل بالإنترنت</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .offline-card {
      background: white;
      border-radius: 20px;
      padding: 50px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .offline-icon {
      font-size: 70px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    .offline-card h1 {
      color: #1e293b;
      font-size: 24px;
      margin-bottom: 15px;
    }
    
    .offline-card p {
      color: #64748b;
      line-height: 1.8;
      margin-bottom: 25px;
    }
    
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 30px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102,126,234,0.4);
    }
    
    .offline-footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>
      عذراً، هذا التطبيق يتطلب اتصالاً نشطاً بالإنترنت
      للتواصل مع خوادم Google ومعالجة البيانات بشكل آمن.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      🔄 إعادة المحاولة
    </button>
    <div class="offline-footer">
      © محمود حسن خرابة - أداة استخراج بيانات التلاميذ
    </div>
  </div>
</body>
</html>
