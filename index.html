<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أداة استخراج بيانات التلاميذ | محمود حسن خرابة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- الشاشة الافتتاحية -->
  <div id="landing-overlay" class="landing-overlay">
    <div class="landing-content">
      <div class="logo-animation">📊</div>
      <h1>أداة استخراج بيانات التلاميذ</h1>
      <p>حل مؤسسي آمن وسريع لاستخراج وتحليل البيانات</p>
      <p class="developer-credit">تصميم وتطوير: أ/ محمود حسن خرابة</p>
      
      <div class="loader">
        <div class="spinner"></div>
        <p>جاري تحميل التطبيق...</p>
      </div>
      
      <button id="emergency-btn" class="emergency-btn" onclick="openAppDirectly()">
        🔗 فتح التطبيق مباشرة في نافذة جديدة
      </button>
    </div>
  </div>

  <!-- رسالة الخطأ -->
  <div id="error-message" class="error-message" style="display: none;">
    <div class="error-content">
      <div class="error-icon">⚠️</div>
      <h2>تعذّر الاتصال بالتطبيق</h2>
      <p>يبدو أن هناك مشكلة في الاتصال بخوادم Google.</p>
      <div class="error-steps">
        <p><strong>خطوات الحل:</strong></p>
        <ol>
          <li>تأكد من اتصالك بالإنترنت</li>
          <li>اضغط الزر أدناه لفتح التطبيق مباشرة</li>
        </ol>
      </div>
      <button onclick="openAppDirectly()" class="retry-btn">
        🔗 فتح التطبيق مباشرة
      </button>
    </div>
  </div>

  <!-- الـ Iframe -->
  <iframe id="app-frame" style="display: none;"></iframe>

  <script>
    // ضع رابط تطبيقك هنا
    const APP_URL = 'https://script.google.com/macros/s/AKfycbx2knIpwWXwwf4ySB-mQGCBgVntA9XTfZGfhHBOX6oA0oCLnMbgDtiXf2sURi1vIzX6zQ/exec';
    
    const landingOverlay = document.getElementById('landing-overlay');
    const errorMessage = document.getElementById('error-message');
    const appFrame = document.getElementById('app-frame');
    
    // تحميل التطبيق
    window.addEventListener('load', function() {
      setTimeout(function() {
        try {
          appFrame.src = APP_URL;
          appFrame.style.display = 'block';
          landingOverlay.style.opacity = '0';
          setTimeout(() => {
            landingOverlay.style.display = 'none';
          }, 800);
        } catch (error) {
          showError();
        }
      }, 2000);
    });
    
    // فتح التطبيق مباشرة
    function openAppDirectly() {
      window.open(APP_URL, '_blank');
    }
    
    // إظهار رسالة الخطأ
    function showError() {
      landingOverlay.style.display = 'none';
      errorMessage.style.display = 'flex';
    }
  </script>
</body>
</html>
