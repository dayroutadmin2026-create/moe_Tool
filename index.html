<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>أداة استخراج بيانات التلاميذ | محمود حسن خرابة</title>

<!-- ========== وسوم PWA ========== -->
<meta name="theme-color" content="#667eea">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="استخراج البيانات">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#f8f9fa;font-family:'Tajawal',sans-serif}

/* ===== iframe الحامل للنظام ===== */
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:none;background:#fff;opacity:0;transition:opacity .8s ease;z-index:1}
#appFrame.show{opacity:1}

/* ===== شاشة الإقلاع ===== */
#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);transition:opacity .8s ease,transform .8s ease}
#splash.hide{opacity:0;transform:scale(1.08);pointer-events:none}
.splash-logo{width:110px;height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;
background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);border-radius:30px;backdrop-filter:blur(12px);
margin-bottom:26px;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.splash-title{color:#fff;font-size:26px;font-weight:900;margin-bottom:8px}
.splash-sub{color:rgba(255,255,255,.8);font-size:14px;font-weight:500;margin-bottom:42px}
.splash-loader{width:220px;height:5px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}
.splash-loader span{display:block;height:100%;width:0;background:linear-gradient(90deg,#a5b4fc,#c4b5fd,#f0abfc);border-radius:10px;animation:load 2.4s ease forwards}
@keyframes load{0%{width:0}50%{width:70%}100%{width:100%}}
.splash-footer{position:absolute;bottom:28px;color:rgba(255,255,255,.55);font-size:12px;font-weight:600}

/* ===== الأزرار العائمة ===== */
.float-btn{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:2000;display:none;align-items:center;gap:9px;
border:none;cursor:pointer;padding:14px 26px;border-radius:50px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:800;
color:#fff;text-decoration:none;box-shadow:0 12px 32px rgba(0,0,0,.35);animation:slideUp .5s ease}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}
#fallbackBtn{background:linear-gradient(135deg,#ef4444,#dc2626)}
</style>
</head>
<body>

<!-- شاشة الإقلاع -->
<div id="splash">
  <div class="splash-logo">📊</div>
  <div class="splash-title">أداة استخراج بيانات التلاميذ</div>
  <div class="splash-sub">حل مؤسسي آمن وسريع لاستخراج وتحليل البيانات</div>
  <div class="splash-loader"><span></span></div>
  <div class="splash-footer">تصميم وتطوير: أ/ محمود حسن خرابة</div>
</div>

<!-- =====================================================
     iframe النظام 
     ملاحظة حاسمة: تم إضافة clipboard-read, clipboard-write, download 
     لأنها ضرورية لعمل أداة السحب (Bookmarklet) وزر تحميل Excel
===================================================== -->
<iframe id="appFrame"
  src="https://script.google.com/macros/s/AKfycbyz9vCzyJn7g5mtxmuzXWaWaVyMcI7IGNpocdI3a5l81plNsEWUbkQTi95oYRz81SvEYA/exec"
  allow="clipboard-read; clipboard-write; download; fullscreen; geolocation"
  title="أداة استخراج بيانات التلاميذ">
</iframe>

<!-- زر الطوارئ (يظهر فقط إذا تأخر التحميل) -->
<a id="fallbackBtn" class="float-btn" href="#" target="_blank" rel="noopener">🔗 فتح التطبيق مباشرة في نافذة جديدة</a>

<script>
// ⚠️ هام جداً: استبدل هذا الرابط برابط نشر تطبيق Google Apps Script الخاص بك
var APP_URL = 'https://script.google.com/macros/s/AKfycbyz9vCzyJn7g5mtxmuzXWaWaVyMcI7IGNpocdI3a5l81plNsEWUbkQTi95oYRz81SvEYA/exec';

// تحديث رابط زر الطوارئ
document.getElementById('appFrame').src = APP_URL;
document.getElementById('fallbackBtn').href = APP_URL;

var frame  = document.getElementById('appFrame');
var splash = document.getElementById('splash');

/* إخفاء شاشة الإقلاع فور جاهزية النظام داخل الـ iframe */
frame.addEventListener('load', function () {
  // ننتظر نصف ثانية للتأكد من أن التطبيق بداخل الـ iframe بدأ rendering
  setTimeout(function () { 
    splash.classList.add('hide'); 
    frame.classList.add('show'); 
  }, 800);
});

/* خطة طوارئ: إذا استغرق التحميل أكثر من 10 ثوانٍ، نظهر زر الفتح المباشر */
setTimeout(function () {
  if (!splash.classList.contains('hide')) {
    splash.style.opacity = '.35';
    document.getElementById('fallbackBtn').style.display = 'flex';
  }
}, 10000);

/* ===== Service Worker للكشف عن حالة الاتصال ===== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (e) { console.warn('SW:', e); });
  });
}
</script>
</body>
</html>
