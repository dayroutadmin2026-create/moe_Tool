<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة استخراج بيانات التلاميذ | محمود حسن خرابة</title>
    <link rel="stylesheet" href="style.css">
    <!-- أيقونة الموقع -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>

    <!-- الشاشة الافتتاحية الأنيقة (Landing Overlay) -->
    <div id="landing-overlay" class="landing-overlay">
        <div class="landing-content">
            <div class="logo-animation">📊</div>
            <h1>أداة استخراج بيانات التلاميذ</h1>
            <p>حل مؤسسي آمن وسريع لاستخراج وتحليل البيانات من موقع الوزارة وملفات PDF</p>
            
            <div class="loader">
                <div class="spinner"></div>
                <p>جاري تجهيز بيئة العمل الآمنة...</p>
            </div>

            <button id="emergency-btn" class="emergency-btn" onclick="forceLoadApp()">
                ⚡ دخول مباشر للتطبيق
            </button>
        </div>
    </div>

    <!-- حاضنة التطبيق (Iframe) -->
    <!-- ملاحظة هندسية حرجة: allow="clipboard-read; clipboard-write" ضرورية جداً لعمل أداة شريط الإشارات والنسخ -->
    <iframe 
        id="app-frame" 
        src="YOUR_GAS_WEB_APP_URL_HERE" 
        allow="clipboard-read; clipboard-write; fullscreen"
        onload="hideLanding()"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads">
    </iframe>

    <script>
        // تسجيل Service Worker للكشف عن حالة الاتصال
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed'));
        }

        // إخفاء الشاشة الافتتاحية عند تحميل التطبيق بنجاح
        function hideLanding() {
            const overlay = document.getElementById('landing-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 800); // انتظار انتهاء تأثير الاختفاء
        }

        // زر الطوارئ: في حال تعليق تحميل Google Apps Script
        function forceLoadApp() {
            const frame = document.getElementById('app-frame');
            frame.src = frame.src; // إعادة تحميل الـ iframe
            document.querySelector('.loader p').textContent = 'جاري فرض التحميل المباشر...';
        }

        // مؤقت أمان: إذا استغرق التحميل أكثر من 10 ثوانٍ، أظهر زر الطوارئ بوضوح
        setTimeout(() => {
            const btn = document.getElementById('emergency-btn');
            if (document.getElementById('landing-overlay').style.display !== 'none') {
                btn.style.display = 'inline-block';
                btn.style.animation = 'pulse 1.5s infinite';
            }
        }, 10000);
    </script>
</body>
</html>
