<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة استخراج بيانات التلاميذ | محمود حسن خرابة</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>

    <!-- الشاشة الافتتاحية الأنيقة -->
    <div id="landing-overlay" class="landing-overlay">
        <div class="landing-content">
            <div class="logo-animation">📊</div>
            <h1>أداة استخراج بيانات التلاميذ</h1>
            <p>حل مؤسسي آمن وسريع لاستخراج وتحليل البيانات من موقع الوزارة وملفات PDF</p>
            
            <div class="loader">
                <div class="spinner"></div>
                <p>جاري تجهيز بيئة العمل الآمنة...</p>
            </div>

            <button id="emergency-btn" class="emergency-btn" onclick="openAppInNewTab()">
                 فتح التطبيق في نافذة جديدة
            </button>
            
            <div class="security-note">
                🔒 التطبيق يعمل على خوادم Google الآمنة
            </div>
        </div>
    </div>

    <script>
        // رابط تطبيق Google Apps Script
        // ⚠️ استبدل هذا الرابط برابط تطبيقك الفعلي
        const APP_URL = 'https://script.google.com/macros/s/AKfycbyOWipcYiNEraIIjyDRlDmX-5ZYj24XbPeTk5aDmlM-GIKT3FodqOgw3nd36UqoEEzM6w/exec';

        // تسجيل Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed'));
        }

        // محاولة فتح التطبيق تلقائياً بعد 2 ثانية
        setTimeout(() => {
            openAppInNewTab();
        }, 2000);

        /**
         * فتح التطبيق في نافذة/تبويب جديد
         * هذا هو الحل الوحيد الموثوق مع Google Apps Script
         */
        function openAppInNewTab() {
            const overlay = document.getElementById('landing-overlay');
            const loaderText = document.querySelector('.loader p');
            
            loaderText.textContent = 'جاري فتح التطبيق...';
            
            // فتح التطبيق في نافذة جديدة
            const appWindow = window.open(APP_URL, '_blank', 'width=1200,height=900');
            
            if (appWindow) {
                // تم الفتح بنجاح
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.innerHTML = `
                        <div class="landing-content">
                            <div class="success-message">
                                <div style="font-size: 80px; margin-bottom: 20px;">✅</div>
                                <h2>تم فتح التطبيق بنجاح!</h2>
                                <p>إذا لم يظهر التطبيق، اضغط على الزر أدناه</p>
                                <button onclick="window.location.reload()" class="retry-btn"> إعادة المحاولة</button>
                            </div>
                        </div>
                    `;
                    overlay.style.display = 'flex';
                }, 800);
            } else {
                // تم منع النافذة المنبثقة
                loaderText.textContent = '⚠️ تم منع النافذة المنبثقة';
                document.getElementById('emergency-btn').style.display = 'inline-block';
            }
        }

        // إظهار زر الطوارئ بعد 5 ثوانٍ إذا لم يفتح التطبيق
        setTimeout(() => {
            const btn = document.getElementById('emergency-btn');
            if (document.getElementById('landing-overlay').style.display !== 'none') {
                btn.style.display = 'inline-block';
                btn.style.animation = 'pulse 1.5s infinite';
            }
        }, 5000);
    </script>
</body>
</html>
